<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Билеты</title>
<meta name="theme-color" content="#120d06">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Билеты">
<link rel="manifest" href="manifest.json">
<style>
  :root { --bg:#120d06; --led:#ffb000; --dim:#6b4d17; --panel:#1d150a; --panel-hi:#2b1e0c; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body {
    background:var(--bg); color:var(--led);
    font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    overflow:hidden; user-select:none; -webkit-user-select:none; touch-action:manipulation;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .app { height:100%; display:grid; grid-template-columns:1fr 2fr 1fr; grid-template-rows:1fr auto; }
  .side {
    border:0; font:inherit; font-size:min(18vw, 96px); font-weight:300; line-height:1;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    transition:background .08s;
  }
  .minus { background:var(--panel); color:var(--dim); }
  .plus  { background:var(--panel-hi); color:var(--led); }
  .side:active { background:var(--led); color:var(--bg); }
  .center { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:0 4px; min-width:0; }
  .label { font-size:15px; color:var(--dim); text-align:center; line-height:1.3; }
  #count {
    font-size:min(24vw, 150px); font-weight:800; font-variant-numeric:tabular-nums; line-height:1;
    text-shadow:0 0 24px rgba(255,176,0,.35);
  }
  #count.bump { animation:bump .12s ease-out; }
  @keyframes bump { from { transform:scale(1.08); } to { transform:scale(1); } }
  .foot { grid-column:1 / -1; display:flex; justify-content:center; padding:10px; background:var(--bg); }
  .reset { background:none; border:1px solid var(--dim); color:var(--dim); border-radius:999px; font:inherit; font-size:14px; padding:10px 28px; cursor:pointer; }
  .reset:active { color:var(--led); border-color:var(--led); }
  @media (prefers-reduced-motion: reduce) { #count.bump { animation:none; } }
</style>
</head>
<body>
<div class="app">
  <button class="side minus" id="minus" aria-label="Минус один">−</button>
  <div class="center">
    <div id="count">0</div>
    <div class="label">оплатили<br>наличными</div>
  </div>
  <button class="side plus" id="plus" aria-label="Плюс один">+</button>
  <div class="foot"><button class="reset" id="reset">Сбросить</button></div>
</div>
<script>
  const KEY = 'cash_counter_v1';
  const el = document.getElementById('count');
  let n = parseInt(localStorage.getItem(KEY), 10) || 0;

  // если остался счёт из версии с историей, забираем сегодняшнее число
  try {
    const days = JSON.parse(localStorage.getItem('cash_counter_days_v1') || 'null');
    if (days) {
      const d = new Date(), pad = x => String(x).padStart(2, '0');
      const k = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
      if (!n && days[k]) n = days[k];
      localStorage.removeItem('cash_counter_days_v1');
    }
  } catch (e) {}

  function show(animate) {
    el.textContent = n;
    localStorage.setItem(KEY, n);
    if (animate) { el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
  }
  function change(d) {
    const next = Math.max(0, n + d);
    if (next === n) return;
    n = next;
    if (navigator.vibrate) navigator.vibrate(d > 0 ? 25 : [15, 40, 15]);
    show(true);
  }
  document.getElementById('plus').addEventListener('click', () => change(1));
  document.getElementById('minus').addEventListener('click', () => change(-1));
  // сброс в два нажатия: без системных окон, они на телефонах иногда блокируются
  const resetBtn = document.getElementById('reset');
  let armed = null;
  resetBtn.addEventListener('click', () => {
    if (armed) {
      clearTimeout(armed); armed = null;
      resetBtn.textContent = 'Сбросить';
      resetBtn.style.color = ''; resetBtn.style.borderColor = '';
      n = 0; show(true);
      if (navigator.vibrate) navigator.vibrate(60);
    } else {
      resetBtn.textContent = 'Нажми ещё раз';
      resetBtn.style.color = 'var(--led)'; resetBtn.style.borderColor = 'var(--led)';
      armed = setTimeout(() => {
        armed = null;
        resetBtn.textContent = 'Сбросить';
        resetBtn.style.color = ''; resetBtn.style.borderColor = '';
      }, 3000);
    }
  });

  // не давать экрану гаснуть
  async function keepAwake() {
    try { if ('wakeLock' in navigator) await navigator.wakeLock.request('screen'); } catch (e) {}
  }
  keepAwake();
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });

  show(false);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
